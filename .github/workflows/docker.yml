name: build-docker

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dongguatv
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Build arm64 tar for offline import
        run: |
          docker buildx build --platform linux/arm64 --load -t dongguatv:arm64 .
          docker save dongguatv:arm64 | gzip > dongguatv-arm64.tar.gz
          ls -lh dongguatv-arm64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dongguatv-arm64-image
          path: dongguatv-arm64.tar.gz
          retention-days: 7
